# E1 ceiling probe — Qwen3-0.6B backbone + 33-dim numeric vector -> MLP head, cross-entropy.
#
# Route decision: LoRA, not full fine-tune. E1 is a CEILING PROBE whose job is a fast, reproducible
# answer to "how high can the LLM+features go", not a production model. LoRA (r=32 on attn+mlp
# projections) + a fully-trained fp32 classification head keeps the run cheap, stable and
# restartable on a single A800, avoids the optimizer-state blowup of full fine-tune on a 0.6B, and
# is standard for this kind of probe. The head sees the pooled last-token hidden state concatenated
# with the frozen, train-fitted, standardised 33-dim vector — the same signal the RF baseline used.
model_name: /path/to/data_root/cache/huggingface/hub/models--Qwen--Qwen3-0.6B/snapshots/c1899de289a04d12100db370d81485cdf75e47ca
max_length: 3200

finetune: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

seed: 0
epochs: 6
batch_size: 8
grad_accum: 4          # effective batch 32 (fixed sample count, recorded in metrics)
lr_backbone: 1.0e-4    # LoRA params
lr_head: 1.0e-3        # classification head
weight_decay: 0.01
warmup_ratio: 0.03
grad_clip: 1.0
head_hidden: 256
head_dropout: 0.1

eval_every_epochs: 1
patience: 3            # early stop on dev accuracy (pre-registered)
min_delta: 0.002
